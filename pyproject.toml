[project]
name = "cmfa"
version = "0.1.0"
description = "Compositional MFA paper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cobra",
    "ipykernel",
    "jax>=0.4.0,<0.9.0",
    "matplotlib",
    "numpy",
    "optimistix",
    "polars",
    "scikit-bio",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmfapoc"]

[tool.ruff]
line-length = 80
