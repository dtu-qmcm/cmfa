[project]
name = "cmfa"
version = "0.1.0"
description = "Compositional MFA paper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax>=0.9.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "numpy>=2.2.4",
    "optimistix>=0.0.11",
    "plotly>=6.5.2",
    "polars>=1.37.1",
    "scikit-bio>=0.7.1.post1",
    "scipy>=1.17.0",
    "ternary-diagram>=3.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmfapoc"]

[tool.ruff]
line-length = 80
