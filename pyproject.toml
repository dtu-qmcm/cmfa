[project]
name = "cmfa"
version = "0.1.0"
description = "Compositional MFA paper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cobra",
    "ipykernel",
    "jax>=0.4.0,<0.9.0",
    "jupyter>=1.1.1",
    "matplotlib",
    "nbformat>=5.10.4",
    "numpy",
    "optimistix",
    "plotly>=6.5.2",
    "polars",
    "python-ternary>=1.0.8",
    "scikit-bio",
    "scipy",
    "seaborn>=0.13.2",
    "ternary-diagram>=3.2.1",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmfa"]

[tool.ruff]
line-length = 80
